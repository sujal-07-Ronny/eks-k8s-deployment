apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend-app

  template:
    metadata:
      labels:
        app: frontend-app

    spec:
      containers:
      - name: frontend-app

        image: your-dockerhub-username/app-name:latest

        ports:
        - containerPort: 80